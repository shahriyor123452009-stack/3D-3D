addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{const f=e.dataTransfer?.files[0];e.preventDefault();if(f&&confirm('Fayldagi kod ishga tushsinmi?'))f.text().then(t=>install(f.name,t))});
const SAMPLE=`KL.extension({
  id:'namuna', name:'Namuna',
  types:{mis:{n:'Mis',rho:8960,c:'#c87533'}},
  presets:[{name:'Mis kub',scene:[['tank',0,0],['mis',0,3]]}],
  actions:[{name:'Hammasini sakratish',run:lab=>lab.objs.forEach(o=>o.b.velocity.y+=5)}],
  panels:[{id:'p',name:'Salom',render:el=>el.textContent='Salom!'}],
  props:[{id:'k',name:'Aylanuvchi kub',x:-4,build:(T,g)=>{const m=new T.Mesh(new T.BoxGeometry(1,1,1),new T.MeshNormalMaterial());m.position.y=1;g.add(m)},update:(g,dt,t)=>g.rotation.y=t}],
  on:{tick:(dt,t,lab)=>{}}
});`;
function openX(t){if(xopen&&xtab==t){xopen=0;xp.classList.remove('on');return}xtab=t;xopen=1;closePop();xp.classList.add('on');uiX()}
function upPanels(){if(xtab=='p')XPN.forEach(p=>{const e=xp.querySelector('[data-pn="'+p.ext+':'+p.id+'"]');if(e&&p.update)try{p.update(e,lab)}catch(_){}})}
const btn=(a,n,i='',c='mb')=>`<button class="${c}" data-x="${a}" data-i="${i}">${n}</button>`;
function uiX(){xp.classList.toggle('tl',xtab=='ed');if(!xopen)return;const lb=xtab!='ed'&&xtab!='m';let h='<div class="xh"><b>'+(xtab=='ed'?'✎ Tahrirlash':xtab=='m'?'Menyu':'🧪 Laboratoriya')+'</b>'+btn('close',ic('x'),'','ib')+'</div>';
 if(lb)h+='<div class="xt">'+[['t','Tajriba'],['j','Jihoz'],['p','Panel'],['e','Extension']].map(([k,n])=>btn('tab',n,k,'mb '+(k==xtab?'on':''))).join('')+'</div>';h+='<div class="xb">';
 if(xtab=='ed')h+=sel?editor():'';
 else if(xtab=='m')h+=`<label class="f">Tortishish g (m/s²)<select data-f="g">${[['Yer',9.81],['Oy',1.62],['Mars',3.72],['Yupiter',24.79],['Vaznsizlik',0]].map(([n,v])=>`<option value="${v}" ${v==G.g?'selected':''}>${n} ${v}</option>`).join('')}</select></label><label class="f">Vaqt tezligi<select data-f="spd">${[.1,.25,.5,1,2].map(v=>`<option ${v==G.spd?'selected':''}>${v}</option>`).join('')}</select></label><div class="xg">${btn('air','Havo qarshiligi: '+(G.air?'bor':'yoʻq'))+btn('save','Saqlash')+btn('load','Yuklash')+btn('clr','Tozalash')}</div>`;
 else if(xtab=='t')h+=XPR.map((p,i)=>btn('pr','<b>'+esc(p.n)+'</b><span>'+esc(p.d)+'</span>',i,'xc')).join('');
 else if(xtab=='j')h+=(Object.keys(XP).map(k=>btn('prop','<b>'+(XP[k].g?'✓ ':'')+esc(XP[k].def.name||k)+'</b>',esc(k),'xc')).join('')||'<p class="xn">Extension jihozlari shu yerda chiqadi</p>')+XA.map((a,i)=>btn('act','<b>'+esc(a.name)+'</b>',i,'xc')).join('');
 else if(xtab=='p')h+=XPN.map(p=>`<div class="xs"><h4>${esc(p.name||p.id)}</h4><div data-pn="${esc(p.ext+':'+p.id)}"></div></div>`).join('');
 else h+='<div class="xs"><input type="text" id="xn" placeholder="Nomi"><textarea id="xc" placeholder="KL.extension({id:…})"></textarea><div class="xg">'+btn('code','▶ Ishga tushir')+btn('file','Fayl')+btn('url','🔗 URL')+btn('dl','⬇ Namuna')+'</div><div class="doc"><code>KL.extension({id,name,types,presets,props,panels,actions,on:{tick},css,setup,dispose})</code>. <code>?ext=URL</code> ham ishlaydi.</div></div><h4>Oʻrnatilganlar</h4>'+EL.map((x,i)=>'<div class="ex"><span>'+esc(x.name)+'</span><span>'+btn('tog',x.off?'Yoq':'Oʻchir',i)+btn('del','✕',i)+'</span></div>').join('');
 xp.innerHTML=h+'</div>';live();if(xtab=='p')XPN.forEach(p=>{const e=xp.querySelector('[data-pn="'+p.ext+':'+p.id+'"]');if(e&&p.render)try{p.render(e,lab)}catch(er){e.textContent=er.message}});upPanels()}
xp.addEventListener('click',async e=>{const b=e.target.closest('[data-x]');if(!b)return;const a=b.dataset.x,k=b.dataset.i,i=+k;
 if(a=='close'){xopen=0;xp.classList.remove('on')}else if(a=='tab'){xtab=k;uiX()}else if(a=='air'){G.air^=1;uiX()}else if(a=='save')save();else if(a=='load')restore();else if(a=='clr')clear();
 else if(a=='pr'){const p=XPR[i];try{if(p.s)lab.load(p.s);if(p.run)p.run(lab);if(!on3)mode(0);toast(p.d||p.n)}catch(er){toast(er.message)}}
 else if(a=='prop')setProp(k,!XP[k].g);else if(a=='act'){try{XA[i].run(lab)}catch(er){toast(er.message)}}
 else if(a=='code'){const c=$('#xc').value;if(c.trim())install($('#xn').value.trim()||'Extension '+(EL.length+1),c)}else if(a=='file')pickFile();
 else if(a=='url'){const u=prompt('Extension URL (.js)');if(u&&confirm('Bu manzildagi KOD ishga tushadi. Ishonchli manbami?\n'+u))install(u,null,u)}
 else if(a=='dl'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([SAMPLE],{type:'text/javascript'}));l.download='fizika-extension-namuna.js';l.click()}
 else if(a=='tog'){const x=EL[i];if(x.off){x.off=false;await activate(x)}else{x.off=true;unrun(x)}persist();uiX()}else if(a=='del'){unrun(EL[i]);EL.splice(i,1);persist();uiX()}});
xp.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const s=e.target.value,v=+s;if(f=='g'||f=='spd'){G[f]=v;return}const o=sel;if(!objs.includes(o))return;
 if(f=='c')o.c=s;else if(!isFinite(v)||s===''||v<0)return uiX();else if(f=='mu'||f=='e')o[f]=f=='e'?Math.min(1,v):v;else if(f=='lv')o.lv=Math.min(o.d[1],v);
 else if(!v)return uiX();else if(f=='rho')o.rho=v;else if(f=='M')o.rho=v/vol(o);else if(f=='V'){const k=Math.cbrt(v/vol(o));o.d=o.d.map(x=>x*k)}
 else{o.d[+f[1]]=clamp(v,.05,20);if(o.s=='sph')o.d=[v,v,v];if(o.s=='cyl')o.d[2]=o.d[0];if(o.s=='tank')o.lv=Math.min(o.lv,o.d[1])}
 build(o);uiX()});
function loadExt(){(async()=>{let sv=[];try{sv=JSON.parse(localStorage.getItem('fc1ext')||'[]')}catch(e){}for(const x of sv){EL.push(x);if(!x.off)await activate(x)}
 const m=$('meta[name=kl-extensions]');for(const u of (m?m.content.split(','):[]))await install(u.trim(),null,u.trim());
 for(const u of new URLSearchParams(location.search).getAll('ext'))if(!EL.some(x=>x.url==u)&&confirm('Havoladagi extension ishga tushsinmi?\n'+u))await install(u,null,u)})()}

const presets=[['💧 Arximed qonuni','Yogʻoch, muz suzadi, temir choʻkadi',[['tank',0,0],['wood',-1.2,3],['ice',0,3],['iron',1.2,3]]],['📐 Ishqalanish','Muz sirpanadi, gʻisht ushlanib turadi',[['ramp',0,1,-0],['ice',1.3,2.5],['brick',0,2.2]]],['🧱 Minora va shar','Sharni minoraga otib yuboring',[['wood',2,.3],['wood',2,.91],['wood',2,1.52],['wood',2,2.13],['steel',-3,.3]]]];
KL.extension({id:'hayot',name:'Hayotiy tajribalar',presets:presets.map(([name,desc,s])=>({name,desc,run:()=>{clear();s.forEach(a=>place(...a))}})),
 panels:[{id:'f',name:'Jismlar holati',render:()=>{},update:e=>{e.innerHTML=objs.filter(o=>o.b.mass).map(o=>`<div class="xr"><span>${esc(T[o.t]?.n||o.t)} (${o.rho.toFixed(0)})</span><b>${o.sub?o.sub>.98?'toʻliq botgan':'botgan '+(o.sub*100).toFixed(0)+'%':o.b.velocity.norm().toFixed(1)+' m/s'}</b></div>`).join('')||'<p class="xn">Jism yoʻq</p>'}}]});
dock();hud();dk();presets[0][2].forEach(a=>place(...a));
const size=()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;dk()};addEventListener('resize',size);size();
let last=performance.now(),acc=0,ui=0;
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000||0));last=now;if(run){acc+=dt*G.spd;while(acc>=1/120){step(1/120);acc-=1/120}}
 objs.forEach(sync);links.forEach(l=>l.line.geometry.setFromPoints([l.a.position,l.b.position].map(p=>new T3.Vector3(p.x,p.y,p.z))));KL.tick(dt,now/1000);if((ui+=dt)>.2){ui=0;if(xopen){live();upPanels()}}camUp();hl.visible=!!sel&&objs.includes(sel);if(hl.visible)hl.setFromObject(sel.mesh);ren.render(scn,cam)})(last);
loadExt();
})();
</script></body></html>
